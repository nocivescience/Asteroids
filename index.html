<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body,
    html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .game {
        display: block;
        background: #000;
        border-radius: 10px;
        margin: auto;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        width: 800px;
        height: 600px;
    }
</style>

<body>
    <canvas id="gameCanvas" class="game" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        console.log(canvas.width, canvas.height);
        class Ship {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 60;
                this.color = 'white';
                this.speed = 3;
                this.angle = 0;
                this.angleSpeed = 4;
                this.vx = 0;
                this.vy = 0;
                this.friction = 0.98;
                this.bullets = [];
                this.rotateLeftButton = false;
                this.rotateRightButton = false;
                this.moveForwardButton = false;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle*Math.PI/180);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2);
                ctx.lineTo(this.width / 2, this.height / 2);
                ctx.lineTo(-this.width / 2, this.height / 2);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
            rotateLeft() {
                this.angle -= this.angleSpeed;
                return this.angle;
            }
            rotateRight() {
                this.angle += this.angleSpeed
                return this.angle;
            };
            moveForward(){
                const rad = this.angle/180 *Math.PI
                this.vx += Math.sin(rad)*this.speed
                this.vy -= Math.cos(rad)*this.speed
                if(this.x+this.width<0)this.x=canvas.width;
                if(this.x>canvas.width)this.x=-this.width;
                if(this.y+this.height<0)this.y=canvas.height;
                if(this.y>canvas.height)this.y=-this.height;
            }
        }
        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (ship.rotateLeftButton) {
                ship.rotateLeft();
            }
            if (ship.rotateRightButton) {
                ship.rotateRight();
            }
            if (ship.moveForwardButton) {
                ship.moveForward();
            }
            if (!ship.moveForwardButton) {
                ship.vx *= ship.friction;
                ship.vy *= ship.friction;
            }
            ship.x += ship.vx;
            ship.y += ship.vy;
            ship.draw();
            requestAnimationFrame(update);
        }
        const ship = new Ship(canvas.width / 2, canvas.height - 70);
        document.addEventListener('keydown', (event) => {
            if (event.key === 'a') {
                ship.rotateLeftButton = true;
                console.log(ship.rotateLeftButton);
            } else if (event.key === 'd') {
                ship.rotateRightButton = true;
                console.log(ship.rotateRightButton);
            } else if (event.key === 'w') {
                ship.moveForwardButton = true;
                console.log(ship.moveForwardButton);
            }
        });
        document.addEventListener('keyup', (event) => {
            if (event.key === 'a') {
                ship.rotateLeftButton = false;
                console.log(ship.rotateLeft());
            } else if (event.key === 'd') {
                ship.rotateRightButton = false;
                console.log(ship.rotateRight());
            } else if (event.key === 'w') {
                ship.moveForwardButton = false;
                console.log(ship.moveForward());
            }
        });
        update();
    </script>
</body>

</html>
